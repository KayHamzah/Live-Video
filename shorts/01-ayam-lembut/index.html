<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* The camera: push-ins move this wrapper, never the video. */
      #cam {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #text-host {
        z-index: 2;
      }
      #subs-host {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="43.8" data-width="1080" data-height="1920">
      <div id="cam">
        <!-- Cut from the live (see edit.json); natural grade and noise reduction are baked in. -->
        <video id="clip" class="clip" src="assets/clip.mp4" data-start="0" data-duration="42.0" data-has-audio="true" data-track-index="0" playsinline></video>
      </div>
      <div id="text-host" data-composition-id="text" data-composition-src="compositions/text.html" data-start="0" data-duration="43.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="subs-host" data-composition-id="subs" data-composition-src="compositions/subs.html" data-start="0" data-duration="42.0" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // A slow push on every cut, alternating direction; close-ups punch in on the overhead inset.
      tl.set("#cam", { scale: 1, transformOrigin: "50% 42%" }, 0);
      tl.set("#cam", { scale: 1.3, transformOrigin: "44% 22%" }, 0.000);
      tl.to("#cam", { scale: 1.36, duration: 1.967, ease: "none" }, 0.000);
      tl.set("#cam", { scale: 1.3, transformOrigin: "44% 22%" }, 1.967);
      tl.to("#cam", { scale: 1.36, duration: 1.500, ease: "none" }, 1.967);
      tl.set("#cam", { scale: 1.3, transformOrigin: "44% 22%" }, 3.467);
      tl.to("#cam", { scale: 1.36, duration: 2.833, ease: "none" }, 3.467);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 6.300);
      tl.to("#cam", { scale: 1.0, duration: 15.200, ease: "none" }, 6.300);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 21.500);
      tl.to("#cam", { scale: 1.035, duration: 1.800, ease: "none" }, 21.500);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 23.300);
      tl.to("#cam", { scale: 1.0, duration: 2.000, ease: "none" }, 23.300);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 25.300);
      tl.to("#cam", { scale: 1.035, duration: 2.933, ease: "none" }, 25.300);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 28.233);
      tl.to("#cam", { scale: 1.0, duration: 4.100, ease: "none" }, 28.233);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 32.333);
      tl.to("#cam", { scale: 1.035, duration: 7.567, ease: "none" }, 32.333);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 39.900);
      tl.to("#cam", { scale: 1.0, duration: 2.100, ease: "none" }, 39.900);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
