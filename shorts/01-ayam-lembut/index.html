<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* The camera: push-ins move this wrapper, never the video. */
      #cam {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #text-host {
        z-index: 2;
      }
      #subs-host {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="50.833" data-width="1080" data-height="1920">
      <div id="cam">
        <!-- Cut from the live (see edit.json); natural grade and noise reduction are baked in. -->
        <video id="clip" class="clip" src="assets/clip.mp4" data-start="0" data-duration="48.633" data-has-audio="true" data-track-index="0" playsinline></video>
      </div>
      <div id="text-host" data-composition-id="text" data-composition-src="compositions/text.html" data-start="0" data-duration="50.833" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="subs-host" data-composition-id="subs" data-composition-src="compositions/subs.html" data-start="0" data-duration="48.633" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // A slow push on every cut, alternating direction; close-ups punch in on the overhead inset.
      tl.set("#cam", { scale: 1, transformOrigin: "50% 42%" }, 0);
      tl.set("#cam", { scale: 1.3, transformOrigin: "44% 22%" }, 0.000);
      tl.to("#cam", { scale: 1.36, duration: 1.493, ease: "none" }, 0.000);
      tl.set("#cam", { scale: 1.3, transformOrigin: "44% 22%" }, 1.533);
      tl.to("#cam", { scale: 1.36, duration: 1.460, ease: "none" }, 1.533);
      tl.set("#cam", { scale: 1.3, transformOrigin: "44% 22%" }, 3.033);
      tl.to("#cam", { scale: 1.36, duration: 2.793, ease: "none" }, 3.033);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 5.867);
      tl.to("#cam", { scale: 1.0, duration: 10.827, ease: "none" }, 5.867);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 16.733);
      tl.to("#cam", { scale: 1.035, duration: 3.060, ease: "none" }, 16.733);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 19.833);
      tl.to("#cam", { scale: 1.0, duration: 10.127, ease: "none" }, 19.833);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 30.000);
      tl.to("#cam", { scale: 1.035, duration: 2.060, ease: "none" }, 30.000);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 32.100);
      tl.to("#cam", { scale: 1.0, duration: 2.960, ease: "none" }, 32.100);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 35.100);
      tl.to("#cam", { scale: 1.035, duration: 3.827, ease: "none" }, 35.100);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 38.967);
      tl.to("#cam", { scale: 1.0, duration: 7.527, ease: "none" }, 38.967);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 46.533);
      tl.to("#cam", { scale: 1.035, duration: 2.060, ease: "none" }, 46.533);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
