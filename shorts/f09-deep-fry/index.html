<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* The camera: push-ins move this wrapper, never the video. */
      #cam {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #text-host {
        z-index: 2;
      }
      #subs-host {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="56.0" data-width="1080" data-height="1920">
      <div id="cam">
        <!-- Cut from the live (see edit.json); natural grade and noise reduction are baked in. -->
        <video id="clip" class="clip" src="assets/clip.mp4" data-start="0" data-duration="53.8" data-has-audio="true" data-track-index="0" playsinline></video>
      </div>
      <div id="text-host" data-composition-id="text" data-composition-src="compositions/text.html" data-start="0" data-duration="56.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="subs-host" data-composition-id="subs" data-composition-src="compositions/subs.html" data-start="0" data-duration="53.8" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // A slow push on every cut, alternating direction; close-ups punch in on the overhead inset.
      tl.set("#cam", { scale: 1, transformOrigin: "50% 42%" }, 0);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 0.000);
      tl.to("#cam", { scale: 1.035, duration: 6.527, ease: "none" }, 0.000);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 6.567);
      tl.to("#cam", { scale: 1.0, duration: 2.393, ease: "none" }, 6.567);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 9.000);
      tl.to("#cam", { scale: 1.035, duration: 5.227, ease: "none" }, 9.000);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 14.267);
      tl.to("#cam", { scale: 1.0, duration: 4.293, ease: "none" }, 14.267);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 18.600);
      tl.to("#cam", { scale: 1.035, duration: 12.327, ease: "none" }, 18.600);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 30.967);
      tl.to("#cam", { scale: 1.0, duration: 14.760, ease: "none" }, 30.967);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 45.767);
      tl.to("#cam", { scale: 1.035, duration: 1.427, ease: "none" }, 45.767);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 47.233);
      tl.to("#cam", { scale: 1.0, duration: 1.927, ease: "none" }, 47.233);
      tl.set("#cam", { scale: 1.0, transformOrigin: "50% 42%" }, 49.200);
      tl.to("#cam", { scale: 1.035, duration: 1.960, ease: "none" }, 49.200);
      tl.set("#cam", { scale: 1.035, transformOrigin: "50% 42%" }, 51.200);
      tl.to("#cam", { scale: 1.0, duration: 2.560, ease: "none" }, 51.200);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
