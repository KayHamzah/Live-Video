    <script>
      const tl = gsap.timeline({ paused: true });
      const PIP = "44% 22%"; // centre of the overhead close-up camera inset

      // One baseline, then every move is a .to() from wherever the camera is.
      tl.set("#cam", { scale: 1.4, transformOrigin: PIP }, 0);

      // Hook: open tight on the overhead close-up (bone pulled with tongs), then pull out to Kak.
      tl.to("#cam", { scale: 1.46, duration: 3.15, ease: "none" }, 0);
      tl.to("#cam", { scale: 1, duration: 0.45, ease: "power3.inOut" }, 3.15);

      // Joke beats: snap in on her face for the punchline, release on the next beat.
      tl.set("#cam", { transformOrigin: "25% 30%" }, 25.9);
      tl.to("#cam", { scale: 1.12, duration: 0.18, ease: "power3.out" }, 25.95);
      tl.to("#cam", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 28.1);
      tl.set("#cam", { transformOrigin: "18% 57%" }, 70.0);
      tl.to("#cam", { scale: 1.12, duration: 0.18, ease: "power3.out" }, 70.12);

      // Reveal: push into the overhead close-up of the finished chicken (on the cut), then settle back.
      tl.set("#cam", { transformOrigin: PIP, scale: 1.2 }, 70.6);
      tl.to("#cam", { scale: 1.38, duration: 0.45, ease: "power3.out" }, 70.6);
      tl.to("#cam", { scale: 1.44, duration: 5.45, ease: "none" }, 71.05);
      tl.to("#cam", { scale: 1, duration: 0.5, ease: "power3.inOut" }, 76.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
